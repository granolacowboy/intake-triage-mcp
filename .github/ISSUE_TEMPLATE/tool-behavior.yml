name: Tool behavior proposal
description: Propose a tool, schema, or invariant change
title: "[behavior] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem requires a behavior change?
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Invariant impact
      description: Which existing guarantee changes, if any? State explicitly if none.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Describe inputs, outputs, side effects, refusal behavior, and provenance expectations.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required evidence
      description: What deterministic tests and/or eval cases should prove the change?
    validations:
      required: true
