name: Public history hygiene

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  public-history-hygiene:
    name: public-history-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Scan pull request metadata and commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "public-history-hygiene",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print(
                      f"::error title=Public history hygiene::"
                      f"GitHub API HTTP {exc.code} while reading PR #{number}."
                  )
                  sys.exit(1)

          pr = get_json(f"https://api.github.com/repos/{repo}/pulls/{number}")

          patterns = [
              (
                  re.compile(
                      r"(?im)^\s*(?:claude|codex|chatgpt|gemini|opencode|kilo)"
                      r"[-_ ]session\s*:"
                  ),
                  "agent session trailer",
              ),
              (
                  re.compile(r"(?i)https?://claude\.ai/code/session_"),
                  "agent session URL",
              ),
              (
                  re.compile(
                      r"(?im)^\s*co-authored-by:\s*"
                      r"(?:claude|codex|chatgpt|gemini|opencode|kilo)\b"
                  ),
                  "AI co-author trailer",
              ),
              (
                  re.compile(
                      r"(?i)(?:🤖\s*)?generated\s+(?:with|by)\s+"
                      r"\[?(?:claude|codex|chatgpt|gemini|opencode|kilo)\b"
                  ),
                  "generated-by attribution",
              ),
          ]

          surfaces = [
              ("pull request title", pr.get("title") or ""),
              ("pull request body", pr.get("body") or ""),
          ]

          page = 1
          while True:
              commits = get_json(
                  f"https://api.github.com/repos/{repo}/pulls/{number}/commits"
                  f"?per_page=100&page={page}"
              )
              for commit in commits:
                  sha = commit.get("sha", "")[:12]
                  message = (commit.get("commit") or {}).get("message") or ""
                  surfaces.append((f"commit {sha}", message))
              if len(commits) < 100:
                  break
              page += 1

          failures = []
          for surface_name, surface_text in surfaces:
              for pattern, label in patterns:
                  if pattern.search(surface_text):
                      failures.append((surface_name, label))

          if failures:
              for surface_name, label in dict.fromkeys(failures):
                  print(
                      f"::error title=Public history hygiene::"
                      f"{surface_name} contains {label}. "
                      "Keep engineering rationale; remove agent/session provenance."
                  )
              sys.exit(1)

          print(
              f"Public history hygiene passed for PR #{number}: "
              f"scanned PR metadata and {len(surfaces) - 2} commit message(s)."
          )
          PY
