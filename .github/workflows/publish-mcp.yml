name: Publish to MCP Registry

# Builds the OCI image, pushes it to GHCR, smoke-tests it, verifies it is
# publicly pullable, then registers the server with the official MCP Registry
# using GitHub OIDC (no interactive login, no long-lived secret).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC auth to the MCP Registry
      contents: read
      packages: write   # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Single-platform, provenance/sbom off => a plain single image manifest so
      # the io.modelcontextprotocol.server.name label sits in the image config
      # the MCP Registry inspects (not hidden behind an attestation index).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/granolacowboy/intake-triage-mcp:0.1.0
            ghcr.io/granolacowboy/intake-triage-mcp:latest

      - name: Smoke test (initialize + tools/list over stdio)
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/granolacowboy/intake-triage-mcp:0.1.0
          docker pull "$IMAGE"
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          OUT=$(printf '%s\n' "$REQ" | docker run -i --rm "$IMAGE" 2>/dev/null || true)
          echo "--- server stdout ---"; echo "$OUT"
          for t in intake_list_practice_areas intake_check_conflicts intake_validate_matter intake_draft_followup intake_log_triage; do
            echo "$OUT" | grep -q "\"$t\"" || { echo "::error::smoke test failed: tool '$t' not found in tools/list"; exit 1; }
          done
          echo "SMOKE OK: all 5 tools present"

      - name: Ensure image is publicly pullable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VIS=$(gh api /user/packages/container/intake-triage-mcp --jq .visibility 2>/dev/null || echo unknown)
          echo "GHCR package visibility: $VIS"
          if [ "$VIS" != "public" ]; then
            gh api -X PATCH /user/packages/container/intake-triage-mcp -f visibility=public 2>/dev/null \
              && echo "Set package visibility to public." \
              || echo "Could not auto-set visibility with GITHUB_TOKEN (expected; needs one UI toggle)."
          fi
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:granolacowboy/intake-triage-mcp:pull" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/granolacowboy/intake-triage-mcp/manifests/0.1.0")
          echo "Anonymous manifest pull: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::ghcr.io/granolacowboy/intake-triage-mcp:0.1.0 is not publicly pullable (HTTP $CODE). In GitHub: Profile -> Packages -> intake-triage-mcp -> Package settings -> Change visibility -> Public, then re-run this workflow (Actions -> Publish to MCP Registry -> Run workflow)."
            exit 1
          fi
          echo "Image is publicly pullable."

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
