name: Publish to MCP Registry

# Publishes a plain single-platform image because the MCP Registry reads the
# ownership label from the image config. Supply-chain evidence is attached
# separately as SBOM, vulnerability report, and keyless Sigstore attestations.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Run release unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SERVER_VERSION=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$SERVER_VERSION" != "$VERSION" ]; then
              echo "::error::tag version $VERSION does not match server.json version $SERVER_VERSION"
              exit 1
            fi
          else
            VERSION="$SERVER_VERSION"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/granolacowboy/intake-triage-mcp" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Keep provenance/sbom off here intentionally: the MCP Registry expects
      # the server-name label on a plain image manifest. Evidence is generated
      # and attached independently below.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/granolacowboy/intake-triage-mcp:${{ steps.release.outputs.version }}
            ghcr.io/granolacowboy/intake-triage-mcp:latest

      - name: Smoke test initialize and tools/list over stdio
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}"
          docker pull "$IMAGE"
          RUNTIME_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "Container runtime UID: $RUNTIME_UID"
          [ "$RUNTIME_UID" != "0" ] || {
            echo "::error::published container unexpectedly runs as root"
            exit 1
          }
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          OUT=$(printf '%s\n' "$REQ" | timeout 120 docker run -i --rm "$IMAGE" 2>/dev/null || true)
          echo "--- server stdout ---"
          echo "$OUT"
          for t in intake_list_practice_areas intake_check_conflicts intake_validate_matter intake_draft_followup intake_log_triage; do
            echo "$OUT" | grep -q "\"$t\"" || {
              echo "::error::smoke test failed: tool '$t' not found in tools/list"
              exit 1
            }
          done

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Record HIGH and CRITICAL vulnerability evidence
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Fail closed on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image and attest SBOM digest with GitHub OIDC
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          SBOM_SHA256=$(sha256sum sbom.cdx.json | awk '{print $1}')
          python3 - "$SBOM_SHA256" <<'PY'
          import json
          import sys
          from pathlib import Path

          predicate = {
              "sbom": {
                  "format": "CycloneDX",
                  "filename": "sbom.cdx.json",
                  "sha256": sys.argv[1],
              }
          }
          Path("sbom-attestation.json").write_text(
              json.dumps(predicate, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type custom --predicate sbom-attestation.json "$IMAGE@$DIGEST"

      - name: Ensure image is publicly pullable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          VIS=$(gh api /user/packages/container/intake-triage-mcp --jq .visibility 2>/dev/null || echo unknown)
          echo "GHCR package visibility: $VIS"
          if [ "$VIS" != "public" ]; then
            gh api -X PATCH /user/packages/container/intake-triage-mcp -f visibility=public 2>/dev/null \
              && echo "Set package visibility to public." \
              || echo "Could not auto-set visibility with GITHUB_TOKEN."
          fi
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:granolacowboy/intake-triage-mcp:pull" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/granolacowboy/intake-triage-mcp/manifests/${{ steps.release.outputs.version }}")
          echo "Anonymous manifest pull: HTTP $CODE"
          [ "$CODE" = "200" ] || {
            echo "::error::published image is not publicly pullable (HTTP $CODE)"
            exit 1
          }

      - name: Install pinned mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.8.1"
          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              EXPECTED_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              EXPECTED_SHA256="8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4"
              ;;
            *)
              echo "::error::unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac
          ASSET="mcp-publisher_linux_${ARCH}.tar.gz"
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${ASSET}"
          echo "${EXPECTED_SHA256}  ${ASSET}" | sha256sum --check --strict
          tar xzf "${ASSET}" mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Write release evidence manifest
        shell: bash
        run: |
          cat > release-evidence.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          version=${{ steps.release.outputs.version }}
          image=${{ steps.release.outputs.image }}
          digest=${{ steps.build.outputs.digest }}
          registry_name=io.github.granolacowboy/intake-triage-mcp
          runtime_user=non-root:mcp
          vulnerability_gate=fixable CRITICAL
          sbom=cyclonedx
          sbom_sha256=$(sha256sum sbom.cdx.json | awk '{print $1}')
          signing=cosign keyless GitHub OIDC
          EOF

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ steps.release.outputs.version }}
          path: |
            sbom.cdx.json
            sbom-attestation.json
            trivy-vulnerabilities.json
            release-evidence.txt
          retention-days: 90

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom.cdx.json sbom-attestation.json trivy-vulnerabilities.json release-evidence.txt --clobber
          else
            gh release create "$TAG" \
              sbom.cdx.json sbom-attestation.json trivy-vulnerabilities.json release-evidence.txt \
              --generate-notes --verify-tag
          fi
