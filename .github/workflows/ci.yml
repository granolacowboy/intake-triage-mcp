name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

  container-smoke:
    name: container MCP smoke test
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t intake-triage-mcp:ci .

      - name: Verify MCP initialize and tools/list
        shell: bash
        run: |
          set -euo pipefail
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          OUT=$(printf '%s\n' "$REQ" | timeout 120 docker run -i --rm intake-triage-mcp:ci 2>/dev/null || true)
          echo "$OUT"
          for tool in             intake_list_practice_areas             intake_check_conflicts             intake_validate_matter             intake_draft_followup             intake_log_triage
          do
            echo "$OUT" | grep -q "\"$tool\"" || {
              echo "::error::tool '$tool' missing from tools/list"
              exit 1
            }
          done
